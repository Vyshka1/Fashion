<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f6f2ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Гардероб">
<title>Гардероб — конструктор образов</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">

  <!-- ГЛАВНАЯ -->
  <section class="screen" data-screen="home">
    <header class="head">
      <div>
        <h1>Мой гардероб</h1>
        <p class="sub" id="home-sub">Загрузите вещи — соберём образы</p>
      </div>
      <button class="icon-btn" id="btn-settings" aria-label="Настройки">
        <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="m19.4 13-.2-1 .2-1 1.6-1.2-1.6-2.8-1.9.6-1.7-1-.3-2h-3.2l-.3 2-1.7 1-1.9-.6L6.8 9.8 8.4 11l-.2 1 .2 1-1.6 1.2 1.6 2.8 1.9-.6 1.7 1 .3 2h3.2l.3-2 1.7-1 1.9.6 1.6-2.8L19.4 13Z"/></svg>
      </button>
    </header>

    <div class="scroll">
      <div class="stat-row" id="home-stats"></div>

      <div class="section-head">
        <h2>Лук дня</h2>
        <button class="text-btn" id="btn-shuffle-home">Другой ↻</button>
      </div>
      <div id="home-outfit"></div>

      <div class="section-head">
        <h2>Недавно добавленное</h2>
        <button class="text-btn" data-goto="closet">Весь гардероб →</button>
      </div>
      <div class="rail" id="home-recent"></div>

      <div class="section-head"><h2>Идеи образов</h2></div>
      <div id="home-ideas"></div>
      <div class="pad-bottom"></div>
    </div>
  </section>

  <!-- ГАРДЕРОБ -->
  <section class="screen" data-screen="closet" hidden>
    <header class="head">
      <div>
        <h1>Гардероб</h1>
        <p class="sub" id="closet-sub"></p>
      </div>
      <button class="icon-btn" id="btn-select-mode" aria-label="Выбрать">
        <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </header>

    <div class="chips-scroll" id="closet-filters"></div>
    <div class="chips-scroll tight" id="closet-status"></div>

    <div class="scroll">
      <div class="grid" id="closet-grid"></div>
      <div class="pad-bottom"></div>
    </div>

    <div class="select-bar" id="select-bar" hidden>
      <span id="select-count">0 выбрано</span>
      <div class="select-actions">
        <button class="mini-btn" id="sel-build">Собрать образ</button>
        <button class="mini-btn danger" id="sel-delete">Удалить</button>
        <button class="mini-btn ghost" id="sel-cancel">Отмена</button>
      </div>
    </div>
  </section>

  <!-- ОБРАЗЫ -->
  <section class="screen" data-screen="looks" hidden>
    <header class="head">
      <div>
        <h1>Образы</h1>
        <p class="sub" id="looks-sub">Подобраны из ваших вещей</p>
      </div>
      <button class="icon-btn" id="btn-regen" aria-label="Обновить">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
    </header>

    <div class="chips-scroll" id="looks-occasion"></div>
    <div class="chips-scroll tight" id="looks-season"></div>

    <div class="scroll">
      <div id="looks-list"></div>
      <div class="pad-bottom"></div>
    </div>
  </section>

  <!-- СОХРАНЁННЫЕ -->
  <section class="screen" data-screen="saved" hidden>
    <header class="head">
      <div>
        <h1>Мои луки</h1>
        <p class="sub" id="saved-sub"></p>
      </div>
    </header>
    <div class="scroll">
      <div id="saved-list"></div>
      <div class="pad-bottom"></div>
    </div>
  </section>

</div>

<!-- НИЖНЕЕ МЕНЮ -->
<nav class="tabbar" id="tabbar">
  <button data-tab="home" class="tab active">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>Главная</span>
  </button>
  <button data-tab="closet" class="tab">
    <svg viewBox="0 0 24 24"><path d="M4 7h16v13H4z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg><span>Гардероб</span>
  </button>
  <button class="tab add" id="btn-add" aria-label="Добавить вещь">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button data-tab="looks" class="tab">
    <svg viewBox="0 0 24 24"><path d="M12 3 9 7H5l2 5-2 5h4l3 4 3-4h4l-2-5 2-5h-4l-3-4Z"/></svg><span>Образы</span>
  </button>
  <button data-tab="saved" class="tab">
    <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg><span>Луки</span>
  </button>
</nav>

<input type="file" id="file-input" accept="image/*" multiple hidden>

<!-- ЛИСТ-РЕДАКТОР ВЕЩИ -->
<div class="sheet-wrap" id="editor" hidden>
  <div class="sheet-backdrop" data-close="editor"></div>
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <button class="text-btn" data-close="editor">Отмена</button>
      <strong id="editor-title">Новая вещь</strong>
      <button class="text-btn accent" id="editor-save">Готово</button>
    </div>
    <div class="sheet-body" id="editor-body"></div>
  </div>
</div>

<!-- КАДРИРОВАНИЕ -->
<div class="sheet-wrap dark" id="cropper" hidden>
  <div class="crop-top">
    <button class="text-btn light" id="crop-cancel">Отмена</button>
    <span id="crop-counter"></span>
    <button class="text-btn light accent" id="crop-done">Дальше</button>
  </div>
  <div class="crop-stage" id="crop-stage">
    <img id="crop-img" alt="">
    <div class="crop-box" id="crop-box">
      <i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i>
    </div>
  </div>
  <div class="crop-bottom">
    <p class="hint">Оставьте в рамке только вещь — так образы получаются точнее</p>
    <div class="crop-ratios">
      <button class="chip" data-ratio="0">Свободно</button>
      <button class="chip active" data-ratio="0.8">4:5</button>
      <button class="chip" data-ratio="1">1:1</button>
      <button class="chip" data-ratio="1.7778">16:9</button>
    </div>
  </div>
</div>

<!-- ПРОСМОТР ОБРАЗА -->
<div class="sheet-wrap" id="look-view" hidden>
  <div class="sheet-backdrop" data-close="look-view"></div>
  <div class="sheet tall">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <button class="text-btn" data-close="look-view">Закрыть</button>
      <strong>Образ</strong>
      <button class="text-btn accent" id="look-save-btn">Сохранить</button>
    </div>
    <div class="sheet-body" id="look-view-body"></div>
  </div>
</div>

<!-- НАСТРОЙКИ -->
<div class="sheet-wrap" id="settings" hidden>
  <div class="sheet-backdrop" data-close="settings"></div>
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <button class="text-btn" data-close="settings">Закрыть</button>
      <strong>Настройки</strong>
      <span style="width:56px"></span>
    </div>
    <div class="sheet-body" id="settings-body"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/color.js"></script>
<script src="js/store.js"></script>
<script src="js/taxonomy.js"></script>
<script src="js/outfits.js"></script>
<script src="js/cropper.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
